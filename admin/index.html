<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <title>Admin Login — Saiko Portfolio</title>
</head>
<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card">
            <h1 class="logo">SAIKO</h1>
            <p class="subtitle">ADMIN DASHBOARD</p>
            <div id="login-error" class="admin-alert admin-alert-error" hidden></div>
            <form id="login-form">
                <div class="admin-form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@example.com">
                </div>
                <div class="admin-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="login-submit" style="width:100%;margin-top:8px;">Sign In</button>
            </form>
            <p style="text-align:center;margin-top:24px;">
                <a href="../index.html" class="btn-outline btn-sm" style="display:inline-block;">← Back to Website</a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/validators.js"></script>
    <script src="../js/portfolio-api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
