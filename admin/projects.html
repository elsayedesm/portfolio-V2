<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <title>Projects — Saiko Admin</title>
</head>
<body class="admin-body">
    <div id="admin-overlay" class="admin-overlay"></div>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="logo">SAIKO<small>ADMIN</small></div>
            <ul class="admin-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="project-form.html">Add Project</a></li>
            </ul>
            <div class="admin-sidebar-footer">
                <a href="#" id="btn-logout" class="btn-outline btn-sm" style="display:block;text-align:center;">Logout</a>
            </div>
        </aside>
        <main class="admin-main">
            <div class="admin-topbar">
                <div>
                    <button type="button" id="menu-toggle" class="admin-menu-toggle">☰ Menu</button>
                    <h1>PROJECTS</h1>
                    <p class="user-email" id="admin-user-email"></p>
                </div>
                <a href="project-form.html" class="btn-primary">+ New Project</a>
            </div>

            <div id="page-alert" class="admin-alert admin-alert-success" hidden></div>

            <div class="admin-card">
                <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px;">
                    <div class="admin-search">
                        <input type="search" id="search-projects" placeholder="Search projects..." aria-label="Search projects">
                    </div>
                </div>

                <div id="projects-loading" class="admin-loading">Loading projects...</div>
                <p id="projects-empty" class="admin-empty" hidden>No projects found. <a href="project-form.html">Create one</a>.</p>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Thumb</th>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projects-tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/validators.js"></script>
    <script src="../js/portfolio-api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
